name: Test
on:
  # PR branches are covered by `pull_request`, so only main runs on push.
  push:
    branches: [main]
    paths:
      - "**"
      # Docs-only changes skip CI. Example drills are test fixtures, so keep them.
      - "!**.md"
      - "!LICENSE"
      - "!NOTICE"
      - "example/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!NOTICE"
      - "example/**"
  # The weekly run catches new RustSec advisories and new stable lints when no
  # code has changed. It runs the Ubuntu jobs only.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    # Skip scheduled runs on forks. Jobs that need this one skip with it.
    if: github.event_name != 'schedule' || github.repository == 'sangddn/hashdrills'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    if: github.event_name != 'schedule' || github.repository == 'sangddn/hashdrills'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: use rust stable
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          components: clippy
          toolchain: stable

      - name: cache rust deps
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  machete:
    if: github.event_name != 'schedule' || github.repository == 'sangddn/hashdrills'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: cache rust deps
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: cargo machete
        run: cargo machete

  deny:
    if: github.event_name != 'schedule' || github.repository == 'sangddn/hashdrills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          rust-version: "1.97"
          command: check advisories licenses

  test:
    # macOS bills at 10x and Windows at 2x, so run the matrix only after the
    # cheap Ubuntu checks pass. Scheduled runs test on Ubuntu only.
    needs: [fmt, clippy]
    strategy:
      fail-fast: true
      matrix:
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: use rust stable
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: stable

      - name: cache rust deps
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fetch deps
        run: cargo fetch --locked

      - name: run tests
        run: cargo test --locked --all-targets --all-features --workspace
        env:
          RUST_LOG: debug

  build:
    # Release builds add nothing on the weekly run, so skip them there.
    if: github.event_name != 'schedule'
    needs: [fmt, clippy]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: use rust stable
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: stable

      - name: cache rust deps
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fetch deps
        run: cargo fetch --locked

      - name: build
        run: cargo build --locked --release --all-features
