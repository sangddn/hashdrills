[package]
name = "hashdrills"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Plaintext generative spaced practice."
authors = ["Sang Doan"]
license = "Apache-2.0"
repository = "https://github.com/sangddn/hashdrills"
homepage = "https://github.com/sangddn/hashdrills"
documentation = "https://docs.rs/hashdrills"
readme = "README.md"
keywords = ["spaced-repetition", "learning", "quiz", "llm", "cli"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/vendor/**",
    "/evals/evaluation_cases.json",
    "/evals/generation_cases.json",
    "/evals/README.md",
    "/evals/benchmark-2026-07-31.md",
    "/example/*.md",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD_PARTY_NOTICES.md",
]

[dependencies]
axum = "0.8.8"
blake3 = "1.8.3"
chrono = "0.4.45"
clap = { version = "4.6.0", features = ["derive"] }
env_logger = "0.11.10"
getrandom = "0.4.3"
libc = "0.2.183"
log = "0.4.32"
maud = "0.27.0"
open = "5.3.3"
pulldown-cmark = "0.13.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "process", "io-util", "time", "fs"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.2"
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.3"
reqwest = { version = "0.13.3", features = ["form", "json"] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
# Allow using `if a { if b { ... } }` instead of `if a && b { ... }`.
collapsible_if = "allow"
# Allow using `match` instead of `if let`.
single_match = "allow"
